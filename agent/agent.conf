# energy-agent configuration
bind_address=127.0.0.1
port=8080
web_root=web
db_path=energy.db
log_file=energy-agent.log

# meter and analytics
pulses_per_kwh=3600
tariff_per_kwh=8.0
window_seconds=10
alert_watts=3000

# pulse source: "simulated" (software only) or "device" (reads the kernel driver)
source=simulated
device_path=/dev/pulsecnt

# initial load for the simulator (ignored when source=device)
sim_watts=1500
